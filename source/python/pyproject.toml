[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamelibrary"
version = "1.0.0"
description = "Python game library manager with cross-platform achievement tracking and backup/restore"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "cryptography>=41.0",
    "apscheduler>=3.10",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.23",
]

[project.scripts]
gamelibrary = "gamelibrary.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
