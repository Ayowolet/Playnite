[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamelibmanager"
version = "0.1.0"
description = "Python game library manager with duplicate detection and library merging"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
    "rapidfuzz>=3.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
gamelibmanager = "gamelibmanager.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
