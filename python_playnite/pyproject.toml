[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-playnite"
version = "1.0.0"
description = "Python game library manager with cross-platform achievement tracking and backup"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "requests>=2.31.0",
    "cryptography>=41.0.7",
    "apscheduler>=3.10.4",
    "tabulate>=0.9.0",
    "tqdm>=4.66.1",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
playnite = "playnite.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["playnite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -v"

[tool.coverage.run]
source = ["playnite"]
omit = ["tests/*"]
