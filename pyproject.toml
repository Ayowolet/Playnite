[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playnite-py"
version = "0.1.0"
description = "Python game library manager with script extensions and automated game action injection"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "watchdog>=3.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.1",
]

[project.scripts]
playnite = "playnite_py.cli:main"

[tool.setuptools.packages.find]
include = ["playnite_py*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
